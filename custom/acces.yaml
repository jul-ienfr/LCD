# custom/acces.yaml — 5 rôles, périmètre par logement, révocable (§1.6, P6-20).
# Champs : role, sous_role, logements (ou parc_client), expire_le (AAAA-MM-JJ),
# mfa (2FA box HA activée : true une fois vérifiée, P6-20).
# 2FA obligatoire super_admin/admin/gestionnaire (tous sous-rôles) : `--check`
# et `GET /acces` alertent tant que `mfa: false` (activer sur la box HA puis
# passer à true — jamais de MFA simulée ici).
# 2FA obligatoire super_admin/admin/gestionnaire. 1 compte nominatif/personne
# (sauf `guest` kiosk). Révocation auto checkout/fin mission.
# Noms anonymisés — remplacer à l'onboarding réel (/systeme wizard §1.6.4-2).

personnes:
  - id: personne_01
    role: super_admin
    sous_role: super_admin
    logements: [log1, log2, log3]            # G4-b : log3 vit sur box-nord
    expire_le: null                       # permanent, rotation secrets seule super_admin
    mfa: false                            # P6-20 : activer 2FA box HA puis true

  - id: personne_02
    role: super_admin
    sous_role: admin                      # bras droit : tout sauf secrets + exports multi-clients
    logements: [log1, log2, log3]         # G4-b : log3 vit sur box-nord
    expire_le: null
    mfa: false                            # P6-20 : activer 2FA box HA puis true

  - id: personne_03
    role: gestionnaire
    sous_role: operateur                  # conciergerie / co-hôte quotidien
    logements: [log1]
    expire_le: null
    mfa: false                            # P6-20 : activer 2FA box HA puis true

  - id: personne_04
    role: gestionnaire
    sous_role: comptable                  # lecture seule Finances + exports
    logements: [log1, log2]
    expire_le: null
    mfa: false                            # P6-20 : activer 2FA box HA puis true

  - id: personne_05
    role: proprietaire
    sous_role: proprio_logement           # client tiers : SES logements seuls
    logements: [log1, log2]
    clients_ref: [client-lab-01]          # §3bis G2bis-b : les clients pour
                                          # lesquels ce compte parle. Absent
                                          # partout ailleurs. Le lien au mandat
                                          # prime sur `logements` : avoir log1
                                          # dans son perimetre ne donne AUCUN
                                          # droit sur l'argent du client de
                                          # log1 — cf. §60, qui teste EXACTEMENT
                                          # ce cas (403 sur le mandat propre).
    expire_le: null
    mfa: false                            # optionnel (PWA/hote, jamais /systeme)

  - id: personne_06
    role: prestataires
    sous_role: menage_interne
    logements: [log1]
    expire_le: null                       # mission courante ; rotation slot à chaque mission
    mfa: false                            # PWA mission seule, jamais HA direct

  - id: personne_07
    role: prestataires
    sous_role: presta_externe
    metier: menage_externe
    zone: santa_severa
    logements: [log1]
    expire_le: null                       # fin mission auto (dispatch §12.4-bis)
    mfa: false                            # PWA mission seule, jamais HA direct

  - id: dashboard_hote
    role: gestionnaire
    sous_role: dashboard                 # COMPTE MACHINE dashboard hôte (LAN seul, P2-9 :
                                          # scripts HA renvoi J-2/J-1 + forçage via rest_command,
                                          # jamais un humain ; tracé tel quel au journal)
    logements: [log1, log2, log3]        # G4-b : log3 vit sur box-nord
    expire_le: null                       # révoquer ici si dashboard compromis (POST /acces-revoquer)
    mfa: false                            # machine LAN, jamais de MFA simulée (hors MFA_EXIGEE)

  - id: passerelle_parc
    role: gestionnaire
    sous_role: dashboard                 # COMPTE MACHINE passerelle parc :8443 (G0/G1) :
                                          # fan-out LECTURE SEULE (/reco-ota /journal /etat
                                          # /todos /routes) vers les moteurs, jamais un humain,
                                          # jamais d'écriture ; tracé tel quel au journal
    logements: [log1, log2, log3]        # G4-b : log3 vit sur box-nord
    expire_le: null                       # révoquer ici si passerelle compromise (POST /acces-revoquer)
    mfa: false                            # machine LAN, jamais de MFA simulée (hors MFA_EXIGEE)

name: v2-sync-ota

on:
  # Filet de sécurité pour les hébergements sans planificateur in-process
  # (Netlify, Vercel). GitHub peut retarder les crons de quelques minutes.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    # Le job est ignoré proprement tant que la variable LCD_APP_URL n'est pas
    # configurée (Settings → Variables) : pas d'échec toutes les 5 minutes
    # avant go-live.
    if: vars.LCD_APP_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Le secret CRON_SECRET n'est pas configuré."
            exit 1
          fi

      - name: Vérifier l'URL de l'application
        env:
          APP_URL: ${{ vars.LCD_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::La variable LCD_APP_URL n'est pas configurée (Settings → Variables)."
            exit 1
          fi
          case "$APP_URL" in
            https://*) ;;
            *) echo "::error::LCD_APP_URL doit commencer par https://"; exit 1 ;;
          esac

      - name: Synchroniser les flux ICS OTA
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.LCD_APP_URL }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/sync-ota?force=1"

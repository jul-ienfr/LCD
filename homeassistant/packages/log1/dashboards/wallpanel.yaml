# homeassistant/packages/log1/dashboards/wallpanel.yaml — Dashboard kiosk WallPanel (P6-9-bis §5.7).
# Tablette murale salon (BYOD voyageur seul pour le reste — 0 € hardware) : profil kiosk
# `guest` verrouillé, 3 vues socle (Accueil/Guide/Urgences) en langue voyageur
# `input_text.log1_langue_voyageur`, WiFi QR <3 s + fallback manuel, code porte heure
# limitée rappelé, QR pièces (salon/cuisine/chambre/SDB/entrée : docs/templates/qr_*.svg
# générés réels au wizard), bandeau offline orange (guide local seul, codes déjà valides).
# Visibility §1.6 + §1.6.4-1 : `input_select.logement_actif in [log1, tous]`
# + `input_boolean.log1_enable_<feature>` par carte (1 feature = 1 flag + 1 visibility).
# Backup papier : QR pièces imprimés si tablette HS (§5.7).

title: WallPanel
views:
  - title: Accueil
    visibility:
      - condition: state
        entity: input_select.logement_actif
        state:
          - log1
          - tous
    cards:
      - type: markdown
        content: >
          Bienvenue {{ marque }} ! WiFi invité : scannez le QR (connexion <3 s)
          ou saisie manuelle. Code porte rappelé (heure limitée).
          Arrivée guidée : QR salon → tour des pièces (cuisine, chambre, SDB, entrée).
          Langue : `input_text.log1_langue_voyageur` (socle FR/EN/ES/IT/DE + maternelle auto §5.7-ter).
        visibility:
          - condition: state
            entity: input_boolean.log1_enable_guide_vivant
            state: "on"
          - condition: state
            entity: input_select.logement_actif
            state:
              - log1
              - tous
      - type: entities
        entities:
          - input_text.log1_langue_voyageur
        visibility:
          - condition: state
            entity: input_boolean.log1_enable_guide_vivant
            state: "on"
          - condition: state
            entity: input_select.logement_actif
            state:
              - log1
              - tous
      - type: markdown
        content: >
          Offline : bandeau orange, guide local seul, codes déjà valides.
          Backup papier : QR pièces imprimés si tablette HS.
        visibility:
          - condition: state
            entity: input_boolean.log1_enable_wallpanel
            state: "on"
  - title: Guide
    visibility:
      - condition: state
        entity: input_select.logement_actif
        state:
          - log1
          - tous
    cards:
      - type: markdown
        content: >
          QR par pièce/appareil : salon (QR accueil), cuisine — LV/LL (bouton fin
          de cycle), tri Métropole NCA ; chambre — clim (chaud 19-21,5 /
          froid 25-27), bruit 22h-8h ; SDB — ECS ; entrée — extincteur, sortie
          jamais bloquée. Fiches `docs/templates/qr_{salon,cuisine,chambre,sdb,entree}.svg`.
        visibility:
          - condition: state
            entity: input_boolean.log1_enable_qr_pieces
            state: "on"
      - type: markdown
        content: >
          Extras (`extras_upsell: on`) : mini-bar honnêteté (conso déclarée +
          QR paiement), catalogue (late/early, kits, courses, petit-déj) —
          pré-commande avant J-1 18h, paiement d'avance.
        visibility:
          - condition: state
            entity: input_boolean.log1_enable_extras_upsell
            state: "on"
          - condition: state
            entity: input_select.logement_actif
            state:
              - log1
              - tous
      - type: markdown
        content: >
          Départ zéro friction : checklist PWA 30 s + photos.
          Enquête J+1 auto (§5.7-bis : ≥4★ lien public, <4★ rattrapage privé <15 min 8h-22h).
        visibility:
          - condition: state
            entity: input_boolean.log1_enable_avis_j1
            state: "on"
  - title: Urgences
    visibility:
      - condition: state
        entity: input_select.logement_actif
        state:
          - log1
          - tous
    cards:
      - type: markdown
        content: >
          Urgences : 112. Hôte : voir contact accueil.
          Coupure eau/élec : voir consignes guide. Extincteur : entrée.
          Incendie : évacuer, la porte se déverrouille, appeler le 112.
          SAV : réponse humaine <15 min (8h-22h), file suivie côté hôte.
        visibility:
          - condition: state
            entity: input_select.logement_actif
            state:
              - log1
              - tous

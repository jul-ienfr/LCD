# custom/llm-proxy/endpoints.yaml — health + timeouts (Phase 7, §6.5/§6.7).
# Timeout 8 s voix / 6 s Jev, retry 1, cooldown 30 s (garde-fous §6.7).
# Santé seule exposée au dashboard /systeme (proxy :4000 jamais WAN).
# Fallback local Ollama si WAN coupé (offline-first §5.1) ; voix = sentences locales seules hors WAN.

health:
  url: "http://<ip-lan>:4000/health"
  interval_seconds: 60
timeouts:
  voix_seconds: 8
  jev_seconds: 6
  retry: 1
  cooldown_seconds: 30
offline_fallback: lcd-chat-local
alerte_cout_mois_eur: 5

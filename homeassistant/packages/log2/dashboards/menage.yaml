# homeassistant/packages/log2/dashboards/menage.yaml — Dashboard MÉNAGE log2 (§1.6.2).
# Pas de todo extras (`extras_upsell: off`) — réassort kit offert seul au checkout.
# Visibility §1.6 + §1.6.4-1 : switcher `input_select.logement_actif in [log2, tous]`
# + `input_boolean.log2_enable_<feature>` par carte (1 feature = 1 flag + 1 visibility).
# Clôture = remise en dispo auto, BLOQUÉE si preuves manquantes.

title: Ménage
views:
  - title: Todos
    visibility:
      - condition: state
        entity: input_select.logement_actif
        state:
          - log2
          - tous
    cards:
      - type: todo-list
        entity: todo.log2_menage
        visibility:
          - condition: state
            entity: input_select.logement_actif
            state:
              - log2
              - tous
      - type: markdown
        content: >
          `todo.log2_menage` auto au checkout (deadline = check-in suivant −2 h).
          Réassort kit bienvenue offert seul (pas de mini-bar, `extras_upsell: off`).
        visibility:
          - condition: state
            entity: input_select.logement_actif
            state:
              - log2
              - tous
  - title: Checklist
    visibility:
      - condition: state
        entity: input_select.logement_actif
        state:
          - log2
          - tous
    cards:
      - type: markdown
        content: >
          ☐ Draps ☐ Consommables ☐ Poubelles/tri ☐ LV/LL lancés
          ☐ Photos entrée/sortie (Companion App → dossier daté)
          ☐ Pointage arrivée/départ PWA/QR
          → clôture = remise en dispo auto, **bloquée si preuves manquantes**.
          Comparatif état des lieux voyageur vs ménage (`etat_lieux_auto: on`).
        visibility:
          - condition: state
            entity: input_boolean.log2_enable_etat_lieux_auto
            state: "on"
          - condition: state
            entity: input_select.logement_actif
            state:
              - log2
              - tous
      - type: markdown
        content: >
          ☐ `intervention.json` AVANT/APRÈS (`traca_intervenants: on`)
          → clôture todo + validation facturation BLOQUÉES si incomplet.
        visibility:
          - condition: state
            entity: input_boolean.log2_enable_traca_intervenants
            state: "on"
          - condition: state
            entity: input_select.logement_actif
            state:
              - log2
              - tous
  - title: Stocks
    visibility:
      - condition: state
        entity: input_select.logement_actif
        state:
          - log2
          - tous
    cards:
      - type: markdown
        content: >
          Seuils Grocy : café, papier, sacs aspirateur, piles AA, produits.
          Liste courses auto + notif hebdo groupée.
        visibility:
          - condition: state
            entity: input_select.logement_actif
            state:
              - log2
              - tous
      - type: markdown
        content: >
          Inventaire (`inventaire_biens: on`) : scan QR/NFC → fiche bien
          (`custom/inventaire/log2/biens.yaml`).
        visibility:
          - condition: state
            entity: input_boolean.log2_enable_inventaire_biens
            state: "on"
          - condition: state
            entity: input_select.logement_actif
            state:
              - log2
              - tous

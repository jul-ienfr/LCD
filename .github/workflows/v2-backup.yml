name: v2-backup

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    # Avant go-live, aucune base de production n'existe : le job est ignoré
    # proprement tant que l'application n'est pas déployée (variable
    # LCD_APP_URL, Settings → Variables), au lieu d'échouer chaque nuit.
    if: vars.LCD_APP_URL != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL || secrets.DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le secret
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "::error::Le secret MIGRATION_DATABASE_URL (owner) n'est pas configuré."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Dump PostgreSQL (checksum, manifeste, chiffrement optionnel)
        run: npm run db:backup

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: lcd-backup-${{ github.run_id }}
          path: |
            v2/backups/*.sql.gz
            v2/backups/*.sql.gz.enc
            v2/backups/*.sql.gz.sha256
            v2/backups/*.sql.gz.enc.sha256
            v2/backups/*.sql.gz.json
            v2/backups/*.sql.gz.enc.json
          retention-days: 30

      # FR-006 : l'absence de copie hors-site doit alerter, jamais rester
      # silencieuse. L'artefact ci-dessus est la copie hors-site (GitHub).
      - name: Alerter en cas d'échec de la sauvegarde
        if: failure()
        env:
          WEBHOOK: ${{ secrets.ALERTE_WEBHOOK_URL }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "${WEBHOOK}" ]; then
            echo "::warning::ALERTE_WEBHOOK_URL absent : alerte non envoyée (voir T-11)."
            exit 0
          fi
          message="Sauvegarde quotidienne en échec (run ${RUN_ID}). Runbook : v2/BACKUPS.md"
          curl -fsS --max-time 15 -X POST -H 'content-type: application/json' \
            --data "$(printf '{"source":"sauvegarde","severite":"critique","message":"%s","runbook":"v2/BACKUPS.md"}' "${message}")" \
            "${WEBHOOK}" || echo "::warning::Webhook d'alerte injoignable."

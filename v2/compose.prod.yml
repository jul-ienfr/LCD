name: lcd-prod

# Rotation des journaux Docker : 7 × 20 Mo par service, pour éviter qu'un
# disque de 40 Go soit saturé par les logs.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "7"

services:
  postgres:
    image: postgres:18-alpine
    container_name: lcd-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - lcd

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: lcd-web
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      BODY_SIZE_LIMIT: 12M
      # Le runtime n'a jamais la connexion owner : migrations, seed et
      # sauvegardes passent par le conteneur `tools` éphémère.
      MIGRATION_DATABASE_URL: ""
      # Tag git réellement déployé, injecté par scripts/deployer.sh.
      LCD_VERSION: ${LCD_VERSION:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - photos:/var/lib/lcd/photos
    networks:
      - lcd

  caddy:
    image: caddy:2-alpine
    container_name: lcd-caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - .env.prod
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - lcd

  tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    profiles: ["tools"]
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lcd

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: lcd-uptime-kuma
    restart: unless-stopped
    logging: *default-logging
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma:/app/data
    networks:
      - lcd

  # Scraper des métriques applicatives (FR-019). Le dossier monitoring/ est
  # monté en lecture seule : `prometheus.yml` (versionné) et `metrics_token`
  # (régénéré depuis .env.prod par scripts/deployer.sh, jamais versionné).
  # Prometheus lit le jeton à chaque scrape : une rotation ne demande pas de
  # redémarrage. Démarrage : --profile monitoring (voir v2/MONITORING.md).
  prometheus:
    image: prom/prometheus:v3
    container_name: lcd-prometheus
    restart: unless-stopped
    logging: *default-logging
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring:/etc/prometheus/lcd:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/lcd/prometheus.yml
      - --storage.tsdb.retention.time=30d
    networks:
      - lcd

volumes:
  pgdata:
  photos:
  caddy_data:
  caddy_config:
  uptime_kuma:
  prometheus_data:

networks:
  lcd:

# deploy/docker-compose.yml — stack auto-hébergée LCD (self-hosted local, 0 €).
#
# Usage :
#   cd lab && docker compose up -d --build        # lab d'abord (moteurs + gateway + HA)
#   cd ../deploy && docker compose up -d --build  # front + Caddy ensuite
#   powershell ./test-deploy.ps1                  # vérification bout en bout (ou sh test-deploy.sh)
#   docker compose down -v                        # teardown entrée seule (lab intact)
#
# Architecture : 2 services SEULEMENT (web + caddy), branchés sur le réseau
# EXISTANT `lcd-lab_default` (external) — jamais de duplication des moteurs :
# le lab FAIT office de box, la gateway lab :8443 reste la vérité runtime.
#   navigateur → Caddy :4001 (TLS interne, lcd.test) → web :3100 (Next SSR)
#     → gateway-parc :8443 (résolu via le réseau lab partagé, jamais publié)
# Ports hôte : 4000 (HTTP→HTTPS) + 4001 (HTTPS). Socle jamais publié.
# Secrets : aucun — LCD_GATEWAY_URL pointe le service lab (valeur docker
# interne, jamais de clé réelle). Fixtures = lab, reset = lab/seed-reset.
# Batterie lab §52/§72 inchangées : elles scrutent custom/.../Caddyfile et
# lab/vps-sim/*, jamais deploy/ (nouveau périmètre assumé, dit ici).

name: lcd-deploy

services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    environment:
      # Nom du service gateway sur le réseau lab partagé (pas 127.0.0.1 :
      # chaque conteneur a son loopback ; le réseau partagé résout les noms).
      LCD_GATEWAY_URL: http://gateway-parc:8443
    expose:
      - "3100"
    networks:
      - lab
      - front
    healthcheck:
      test: ["CMD", "node", "-e",
        "fetch('http://127.0.0.1:3100/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    ports:
      # 4000 = HTTP (redirect auto → HTTPS), 4001 = HTTPS (lcd.test).
      # :4000 gateway-llm de la BOX en prod — jamais publié ici non plus,
      # et en local le lab ne le publie pas : pas de collision possible.
      - "4000:80"
      - "4001:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - deploy-caddy-data:/data
      - deploy-caddy-config:/config
    networks:
      # front (vers web) + lab (vers gateway-parc :8443) — Caddy doit
      # résoudre les noms sur les DEUX réseaux pour router.
      - front
      - lab
    depends_on:
      web:
        condition: service_healthy

networks:
  # Réseau EXISTANT du lab (moteurs + gateway + HA) — créé par lab/docker-compose.
  lab:
    name: lcd-lab_default
    external: true
  front:
    name: lcd-deploy_front

volumes:
  deploy-caddy-data:
  deploy-caddy-config:

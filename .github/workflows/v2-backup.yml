name: v2-backup

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL || secrets.DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le secret
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "::error::Le secret MIGRATION_DATABASE_URL (owner) n'est pas configuré."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Dump PostgreSQL (checksum, manifeste, chiffrement optionnel)
        run: npm run db:backup

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: lcd-backup-${{ github.run_id }}
          path: |
            v2/backups/*.sql.gz
            v2/backups/*.sql.gz.enc
            v2/backups/*.sql.gz.sha256
            v2/backups/*.sql.gz.enc.sha256
            v2/backups/*.sql.gz.json
            v2/backups/*.sql.gz.enc.json
          retention-days: 30

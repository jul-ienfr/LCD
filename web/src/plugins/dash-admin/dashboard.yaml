# dash-admin — V6 §S3.5 : comme super SAUF secrets/rotation (403 testé).
# Route /supervision distincte de /systeme (dash-super) : 1 route = 1 plugin.
# F5 : routes créées alors (actif false = route 404 + journal, §S3.2).
id: dash-admin
version: "0.1.0"
actif: false
roles: [super_admin, admin]
routes: [/supervision]
apis:
  - GET /health
  - GET /ready
  - GET /metrics
  - GET /parc/entites
flags: []
i18n_prefixe: admin.
route_prefix: /systeme
lite: false
offline: false

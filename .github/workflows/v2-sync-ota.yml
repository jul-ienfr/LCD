name: v2-sync-ota

on:
  # Filet de sécurité pour les hébergements sans planificateur in-process
  # (Netlify, Vercel). GitHub peut retarder les crons de quelques minutes.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Le secret CRON_SECRET n'est pas configuré."
            exit 1
          fi

      - name: Synchroniser les flux ICS OTA
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://lcd-parc.netlify.app/api/cron/sync-ota?force=1"

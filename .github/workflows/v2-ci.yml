name: v2-ci

on:
  push:
    paths:
      - "v2/**"
      - ".github/workflows/v2-ci.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2-ci.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://lcd:lcd@127.0.0.1:5432/lcd
      AUTH_SECRET: ci-only-change-me-please
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

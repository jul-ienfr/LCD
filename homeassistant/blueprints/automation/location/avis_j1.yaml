# homeassistant/blueprints/automation/location/avis_j1.yaml — blueprint enquête J+1 (P6-9-bis §5.7-bis).
# Trigger : event lcd_avis_j1 (decision-engine, enquête post-séjour), data
#   {logement_id, message}. Actions : envoie le message d'enquête localisé
#   (composé par decision-engine, langue voyageur socle + auto §5.7-ter,
#   gabarit docs/templates/message_avis_j1[.xx].md : >=4★ lien public,
#   <4★ rattrapage privé). Jamais de PIN ici (pas de data.pin, pas de MQTT).
# Contraintes : jamais de PIN en clair dans les logs (excludes recorder/logbook
#   configuration.yaml) ; message signé marque, jamais « LCD/HA ».

blueprint:
  name: LCD Enquête avis J+1
  description: Enquête satisfaction J+1 post-séjour, message localisé decision-engine.
  domain: automation
  input:
    logement_id:
      name: Logement
      description: Slug logement (log1, log2...). Filtre l'event.
      selector:
        text:
    notify_service:
      name: Service de notification
      description: Service notify invité (ex. notify.sms_free_log1). Le texte vient de event data.message.
      default: notify.persistent_notification
      selector:
        text:

variables:
  logement: !input logement_id

trigger:
  - platform: event
    event_type: lcd_avis_j1

condition:
  - condition: template
    value_template: "{{ trigger.event.data.get('logement_id', '') == logement }}"

action:
  - service: !input notify_service
    data:
      message: "{{ trigger.event.data.get('message', '') }}"

mode: single

# custom/booking-direct/config.yaml — tunnel direct maison P2-15 (§4-bis).
# Cible Phase 2+ (`moteur_direct: maison`) ; Phase 1 = QloApps transitoire.
# Secrets JAMAIS ici (env LCD_* ou secrets.yaml).
http_port: 8095
state_dir: "./state"
decision_log_dir: "./state"   # box : monter /config/logs/ ici
secrets_yaml: "./secrets.yaml"
logements_yaml: "../logements.yaml"
# Mêmes URLs LXC (127.0.0.1) — surcharge via LCD_ICS_URL / LCD_PRICING_URL / etc.
ics_url: "http://127.0.0.1:8090"
pricing_url: "http://127.0.0.1:8091"
facturation_url: "http://127.0.0.1:8093"
caution_url: "http://127.0.0.1:8094"
# Checkout Stripe PRÉPARÉ seul (lien à valider 1-tap humaine, jamais d'encaissement auto).
# Clé via STRIPE_SECRET_KEY (test sur box, prod après recette).
# Catalogue extras vendables d'avance (§5.6-ter) — prix TTC affichés avant résa.
# Format `id: Nom affiché | prix_ttc` ; tout extra pré-commandé avant J-1 18h, payé d'avance.
extras:
  late_checkout_14h: Late checkout 14h (si pas d'arrivée jour J) | 50
  early_checkin_12h: Early check-in 12h (si pas de départ jour J) | 30
  transfert_aeroport: Transfert aéroport (VTC partenaire) | 30
  transfert_aeroport_siege_enfant: Transfert aéroport + siège enfant | 40
  courses_intermarche: Forfait courses Intermarché (hors tickets) | 25
  petit_dej: Petit-déj (par pers, coût 5) | 15
  deco_anniversaire_romantique: Déco anniversaire/romantique | 49
  pack_teletravail: Pack télétravail / séjour (+10 visio sur place) | 25
  chef_domicile_panier_apero: Panier apéro chef à domicile (par pers, comm 15 %) | 69
  kit_bebe: Kit bébé / séjour | 40
  kit_plage: Kit plage / séjour | 20
  menage_intermediaire_7j: Ménage intermédiaire 7j | 60
  linge_supplementaire: Linge supplémentaire (par pers) | 15
  consigne_bagages: Consigne bagages | 15
  accueil_physique: Accueil physique (self check-in gratuit par défaut) | 30
  impression_scan: Impression/scan (par page) | 1
  pressing_retrait_livraison: Pressing retrait+livraison (hors tickets) | 15
  massage_domicile: Massage à domicile (par h, presta diplômé) | 75
  babysitting: Babysitting (par h, diplômée + RC pro) | 30
# Partenariats sans stock (liens affiliés, 0 € encaissé ici) :
urls:
  location_voiture_velo: "https://example.invalid/partenaire-auto-velo"
  resa_resto_plage: "https://example.invalid/partenaire-resto-plage"

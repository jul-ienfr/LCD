name: v2-relances

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

jobs:
  relances:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Le secret CRON_SECRET n'est pas configuré."
            exit 1
          fi

      - name: Relancer les factures échues
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://lcd-parc.netlify.app/api/cron/relances"

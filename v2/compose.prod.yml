name: lcd-prod

services:
  postgres:
    image: postgres:18-alpine
    container_name: lcd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - lcd

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: lcd-web
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lcd

  caddy:
    image: caddy:2-alpine
    container_name: lcd-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - .env.prod
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - lcd

  tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    profiles: ["tools"]
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lcd

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: lcd-uptime-kuma
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma:/app/data
    networks:
      - lcd

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  uptime_kuma:

networks:
  lcd:

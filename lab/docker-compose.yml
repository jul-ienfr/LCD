      timeout: 5s
      retries: 5

  # Agent box NORD (G4-b) : tourne SUR la box nord, lit les moteurs LOCAUX
  # (pricing-nord :8191 / decision-nord :8192) et pousse vers la passerelle
  # :8443 (`POST /ingest` + heartbeat, boucle 60 s). File outbox persistante
  # (volume dédié, jamais jetée) : passerelle coupée = fichiers qui
  # s'accumulent, passerelle revenue = rejeu idempotent (§16.2).
  agent-nord:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: lab/Dockerfile.moteur
      args:
        SCRIPT: custom/passerelle-parc/agent_box.py
        CONFIG: lab/lab-config/box-nord/agent-box-nord.yaml
    environment:
      LCD_STATE_DIR: /opt/lcd/state
    volumes:
      - agent-nord-outbox:/opt/lcd/outbox
      - ./lab-config/box-nord/agent-box-nord.yaml:/opt/lcd/agent-box.yaml:ro
    # L'agent écrit sa file DANS son volume : il doit pouvoir le créer.
    # (Les moteurs tournent en `lcd`, mais eux reçoivent des volumes que
    # l'image a déjà créés + chown au build — ici le chemin est nouveau.)
    user: "0:0"
    command: >
      sh -c "python3 /opt/lcd/custom/passerelle-parc/agent_box.py
      --config /opt/lcd/agent-box.yaml --serve"
    depends_on:
      pricing-nord:
        condition: service_healthy
      decision-nord:
        condition: service_healthy
      gateway-parc:
        condition: service_healthy
  # (prix/journal/etat/todos/routes) + cache 2 niveaux + stale horodaté.
  # 0 écriture : jamais de PIN/secret/action (POST /v1/action = G2).
  # Registre box = lab/lab-config/passerelle-parc-boxes.yaml (0 secret).
  gateway-parc:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: lab/Dockerfile.moteur
      args:
        SCRIPT: custom/passerelle-parc/gateway.py
        CONFIG: lab/lab-config/passerelle-parc.yaml
    ports: ["8443:8443"]
    environment:
      LCD_BIND: "0.0.0.0"
      LCD_HTTP_PORT: "8443"
      LCD_STATE_DIR: /opt/lcd/state
    volumes:
      - passerelle-state:/opt/lcd/state
      - ./logements.lab.yaml:/opt/lcd/logements.yaml:ro
      # (G4-b) Registre des box : la copie LAB déclare box-lab + box-nord.
      # Monté en LECTURE seule : le registre est versionné, on l'édite au
      # dépôt, jamais depuis le conteneur.
      - ./lab-config/passerelle-parc-boxes.yaml:/opt/lcd/lab-config/passerelle-parc-boxes.yaml:ro
      # Registre ECRIT par le CRUD `/parc/*` (§6bis) — répertoire DÉDIÉ au test,
      # monté en LECTURE-ECRITURE. Ce n'est PAS `logements.yaml` : celui-là est
      # lu par les moteurs, on n'écrit jamais dans une source partagée.
      # Répertoire (et pas fichier) pour que `tmp + os.replace` reste ATOMIQUE :
      # sur un fichier bind-monté, os.replace est refusé (EBUSY).
      - ./parc-registre:/opt/lcd/parc-registre
      - ../custom/acces.yaml:/opt/lcd/acces.yaml:ro
      # Révoquations runtime de decision (volume `ics-logs`) en LECTURE SEULE :
      # une révocation bloque les écritures relayées sous `rbac_cache_s` (10 s).
      - ics-logs:/opt/lcd/decision-logs:ro
      # Documents de mandat du portail propriétaire (§17/G2bis-b) : racine
      # DÉDIÉE, montée en LECTURE SEULE (le portail sert, il ne dépose
      # rien). Le test écrit côté hôte ; le conteneur lit via le bind.
      - ./docs.lab:/opt/lcd/docs:ro
      # Routage IA/LLM (§15) : copie lab versionnée, lecture seule.
      - ./lab-config/passerelle-parc-llm.yaml:/opt/lcd/lab-config/passerelle-parc-llm.yaml:ro
      # i18n 5 langues (§17) : catalogues versionnés, lecture seule.
      - ../custom/passerelle-parc/i18n:/opt/lcd/custom/passerelle-parc/i18n:ro
    command: >
      sh -c "python3 /opt/lcd/custom/passerelle-parc/gateway.py
      --config /opt/lcd/config.yaml --serve"
    depends_on:
      pricing:
        condition: service_healthy
      decision:
        condition: service_healthy
      pricing-nord:
        condition: service_healthy
      decision-nord:
        condition: service_healthy
      dispatch-presta:
        condition: service_healthy
      llm-router-ui:
        condition: service_healthy
      booking-direct:
        condition: service_healthy
      compta:
        condition: service_healthy
      caution:
        condition: service_healthy
      ics-sync:
        condition: service_healthy
      facturation:
        condition: service_healthy
      extras:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8443/health',timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Box HA virtuelle (lab) : Home Assistant conteneur + provisionnement headless.
  # Boucles prouvées §40 (moteurs→HA : events/sensors/calendar) + §41
  # (HA→moteur : script → rest_command → decision, qui=dashboard_hote).
  ha-bootstrap:
    image: python:3.12-slim
    volumes:
      - haconfig:/config
      - ./ha-virtual/bootstrap.py:/bootstrap.py:ro
    command: ["python3", "/bootstrap.py"]
    restart: "no"
  homeassistant:
    restart: unless-stopped
    image: homeassistant/home-assistant:stable
    ports: ["8123:8123"]
    environment:
      TZ: "Europe/Paris"
    volumes:
      - haconfig:/config
      - ./ha-virtual/configuration.yaml:/config/configuration.yaml:ro
      - ./ha-virtual/secrets.yaml:/config/secrets.yaml:ro
      - ../homeassistant/packages:/config/packages:ro
    depends_on:
      ha-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request,urllib.error\ntry:\n urllib.request.urlopen('http://127.0.0.1:8123/api/',timeout=5)\nexcept urllib.error.HTTPError as e:\n raise SystemExit(0 if e.code==401 else 1)"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s

volumes:
  haconfig:
  ics-state:
  pricing-state:
  decision-state:
  ics-nord-state:
  pricing-nord-state:
  decision-nord-state:
  agent-nord-outbox:
  facturation-state:
  caution-state:
  booking-state:
  dispatch-state:
  inventaire-state:
  extras-state:
  stocks-state:
  compta-state:
  router-state:
  passerelle-state:
  ics-logs:

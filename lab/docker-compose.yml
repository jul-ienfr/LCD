      retries: 5

  # Dashboard pilote :8060 (P1-13/P2-9) : AU-DESSUS de HA, parle aux moteurs
  # (prix/journal/todos/routage), multi-logements/multi-box via config.
  # Lecture seule : jamais d'écriture/PIN/secret. PWA = autre étage.
  dashboard-hote:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: lab/Dockerfile.moteur
      args:
        SCRIPT: custom/dashboard-hote/dashboard.py
        CONFIG: lab/lab-config/dashboard.yaml
    ports: ["8060:8060"]
    environment:
      LCD_BIND: "0.0.0.0"
      LCD_HTTP_PORT: "8060"
    command: >
      sh -c "python3 /opt/lcd/custom/dashboard-hote/dashboard.py

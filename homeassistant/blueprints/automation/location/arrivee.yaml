# homeassistant/blueprints/automation/location/arrivee.yaml — blueprint arrivée (§5.2, P1-8/P3-3/P3-4).
# Paramètre logement_id (jamais d'entity_id en dur). Déclenché par events decision-engine/ics-sync :
#   lcd_j2_envoi_acces (J-2) et lcd_j1_rappel (J-1 15h), data {logement_id, pin, slot_nom,
#   arrivee, depart, message, langue, lien_pwa, lien_guide, qr_salon, wifi_qr}.
# J-2 : publie le PIN vers Nuki Hub (smart_lock: on) + envoie le message d'accès localisé
#   (composé par decision-engine, langue voyageur socle + auto §5.7-ter, lien PWA + QR salon).
# J-1 15h : rappel seul, jamais de re-push PIN. Log2 (smart_lock: off) : data.pin vide +
#   data.message = consigne boîte à clés → pas de MQTT, pas d'alerte batterie,
#   pas de déverrouillage auto incendie (§5.2).
# Contraintes : jamais de PIN en clair dans les logs (4 derniers chiffres + exclude recorder/logbook
#   configuration.yaml) ; jamais de révocation punitive en cours de séjour (cf. depart_menage.yaml) ;
#   sans WAN le PIN test ouvre en Thread local (critère P3-7).

blueprint:
  name: LCD Arrivée voyageur
  description: Envoi accès J-2 (PIN Nuki Hub si smart_lock) + rappel J-1 15h, message localisé.
  domain: automation
  input:
    logement_id:
      name: Logement
      description: Slug logement (log1, log2...). Filtre les events + topic MQTT.
      selector:
        text:
    notify_service:
      name: Service de notification
      description: Service notify invité (ex. notify.sms_free_log1). Le texte vient de event data.message.
      default: notify.persistent_notification
      selector:
        text:

variables:
  logement: !input logement_id

trigger:
  - platform: event
    event_type: lcd_j2_envoi_acces
    id: j2
  - platform: event
    event_type: lcd_j1_rappel
    id: j1

condition:
  - condition: template
    value_template: "{{ trigger.event.data.get('logement_id', '') == logement }}"

action:
  - choose:
      - conditions:
          - condition: trigger
            id: j2
        sequence:
          - if:
              - condition: template
                value_template: "{{ trigger.event.data.get('pin', '') != '' }}"
            then:
              - service: mqtt.publish
                data:
                  topic: "nukihub/{{ logement }}/keypad/command/add"
                  # Format Nuki Hub keypad add — adapter au firmware installé (cf. §5.2).
                  payload: "{{ {'code': trigger.event.data.pin, 'name': trigger.event.data.get('slot_nom', 'voyageur'), 'timeLimited': true, 'allowedFromDate': trigger.event.data.get('arrivee'), 'allowedToDate': trigger.event.data.get('depart')} | tojson }}"
              - service: homeassistant.turn_on
                target:
                  entity_id: "input_boolean.{{ logement }}_occupation"
          - service: !input notify_service
            data:
              message: "{{ trigger.event.data.get('message', '') }}"
      - conditions:
          - condition: trigger
            id: j1
        sequence:
          - service: !input notify_service
            data:
              message: "{{ trigger.event.data.get('message', '') }}"

mode: single

# lab/docker-compose.yml — lab Docker LCD sur PC (branche lab/docker).
# Code dans CE repo, tests ici, déploiement prod/box ENSUITE (jamais depuis le lab).
# Le lab FAIT OFFICE DE BOX : mêmes images génériques transférables, mêmes ports,
# mêmes volumes — seule la config/logements/secrets change par box/logement.
# 0 € logiciel (images python:slim). LAN du lab = réseau docker interne (pas de WAN).
# Secrets : env LCD_* (valeurs FAUSSES de lab) ou lab/secrets.lab.yaml —
# JAMAIS commités (voir .gitignore lab/*state*/ lab/secrets*), JAMAIS de clés réelles.
# Règle persistante : secrets/clés API dans secrets.yaml, jamais commitées.
#
# Usage :
#   cd lab && docker compose up -d --build
#   python3 tests_lab.py            # batterie P2-14 (résa <60 s + conflit ICS + bornes)
#   docker compose down -v          # teardown (volumes runtime supprimés)

name: lcd-lab

services:
  ics-sync:
    build:
      context: ..
      dockerfile: lab/Dockerfile.moteur
      args:
        SCRIPT: custom/ics-sync/ics_sync.py
        CONFIG: lab/lab-config/ics-sync.yaml
    ports: ["8090:8090"]
    environment:
      LCD_BIND: "0.0.0.0"
      LCD_HTTP_PORT: "8090"
      LCD_STATE_DIR: /opt/lcd/state
      LCD_DECISION_LOG_DIR: /opt/lcd/logs
      # Secrets de LAB (faux) — jamais de clés réelles ici :
      LCD_SECRETS_YAML: /opt/lcd/secrets.yaml
      # Box HA virtuelle : push events/states réel (JWT lab forgé).
      LCD_HA_URL: http://homeassistant:8123
      LCD_HA_REFRESH_ID: "6c6162326f782d7669727475616c2d02"
      LCD_HA_JWT_KEY: "6c61622d7669727475616c2d6a77742d6c61622d30312d6c61622d3032"
    volumes:
      - ics-state:/opt/lcd/state
      - ics-logs:/opt/lcd/logs
      - ./logements.lab.yaml:/opt/lcd/logements.yaml:ro
      - ./secrets.lab.yaml:/opt/lcd/secrets.yaml:ro
    command: >
      sh -c "python3 /opt/lcd/custom/ics-sync/ics_sync.py
      --config /opt/lcd/config.yaml"
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5

  pricing:
    build:
      context: ..
      dockerfile: lab/Dockerfile.moteur
      args:
        SCRIPT: custom/pricing-engine/pricing_engine.py
        CONFIG: lab/lab-config/pricing-engine.yaml
    ports: ["8091:8091"]
    environment:
      LCD_BIND: "0.0.0.0"
      LCD_HTTP_PORT: "8091"
      LCD_STATE_DIR: /opt/lcd/state
      LCD_DECISION_LOG_DIR: /opt/lcd/logs
      LCD_SECRETS_YAML: /opt/lcd/secrets.yaml
      LCD_ICS_SYNC_URL: http://ics-sync:8090
      # Box HA virtuelle : push sensors réel (JWT lab forgé).
      LCD_HA_URL: http://homeassistant:8123
      LCD_HA_REFRESH_ID: "6c6162326f782d7669727475616c2d02"
      LCD_HA_JWT_KEY: "6c61622d7669727475616c2d6a77742d6c61622d30312d6c61622d3032"
    volumes:
      - pricing-state:/opt/lcd/state
      - ics-logs:/opt/lcd/logs
      - ./logements.lab.yaml:/opt/lcd/logements.yaml:ro
      - ./secrets.lab.yaml:/opt/lcd/secrets.yaml:ro
    depends_on:
      ics-sync:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8091/health',timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5

  decision:
    build:
      context: ..
      dockerfile: lab/Dockerfile.moteur
      args:
        SCRIPT: custom/decision-engine/decision.py
        CONFIG: lab/lab-config/decision-engine.yaml
    ports: ["8092:8092"]
    environment:
      LCD_BIND: "0.0.0.0"
      LCD_HTTP_PORT: "8092"
      LCD_STATE_DIR: /opt/lcd/state
      LCD_DECISION_LOG_DIR: /opt/lcd/logs
      LCD_SECRETS_YAML: /opt/lcd/secrets.yaml
      LCD_ICS_SYNC_URL: http://ics-sync:8090
      LCD_PRICING_URL: http://pricing:8091
      # Box HA virtuelle : push events réel (JWT lab forgé).
      LCD_HA_URL: http://homeassistant:8123
      LCD_HA_REFRESH_ID: "6c6162326f782d7669727475616c2d02"
      LCD_HA_JWT_KEY: "6c61622d7669727475616c2d6a77742d6c61622d30312d6c61622d3032"
    volumes:
      - decision-state:/opt/lcd/state
      - ics-logs:/opt/lcd/logs
      - ./logements.lab.yaml:/opt/lcd/logements.yaml:ro
      - ../custom/acces.yaml:/opt/lcd/acces.yaml:ro
      - ./secrets.lab.yaml:/opt/lcd/secrets.yaml:ro
      - ./branding.lab.yaml:/opt/lcd/branding.yaml:ro
      # memoire.lab en RW (box-equivalent) : registre opt-in muté à chaque
      # opt-in/out/purge (geste humain seul). Reset : `git checkout -- memoire.lab`.
      - ./memoire.lab/:/opt/lcd/memoire
    command: >
      sh -c "python3 /opt/lcd/custom/decision-engine/decision.py
      --config /opt/lcd/config.yaml
      --logements /opt/lcd/logements.yaml
      --acces /opt/lcd/acces.yaml
      --branding /opt/lcd/branding.yaml
      --memoire /opt/lcd/memoire/voyageurs.lab.yaml --serve"
    depends_on:
      ics-sync:
        condition: service_healthy
      pricing:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8092/health',timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5

  facturation:
    build:
      context: ..
      dockerfile: lab/Dockerfile.moteur
      args:
        SCRIPT: custom/facturation/facturation.py
        CONFIG: lab/lab-config/facturation.yaml
    ports: ["8093:8093"]
    environment:
      LCD_BIND: "0.0.0.0"
      LCD_HTTP_PORT: "8093"
      LCD_STATE_DIR: /opt/lcd/state
      LCD_DECISION_LOG_DIR: /opt/lcd/logs
    volumes:
      - facturation-state:/opt/lcd/state
      - ics-logs:/opt/lcd/logs
      - ./logements.lab.yaml:/opt/lcd/logements.yaml:ro
      - ./branding.lab.yaml:/opt/lcd/branding.yaml:ro
    command: >
      sh -c "python3 /opt/lcd/custom/facturation/facturation.py
      --config /opt/lcd/config.yaml
      --logements /opt/lcd/logements.yaml
      --branding /opt/lcd/branding.yaml --serve"
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8093/health',timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5

  caution:
    build:
      context: ..
      dockerfile: lab/Dockerfile.moteur
      args:
        SCRIPT: custom/caution/caution.py
        CONFIG: lab/lab-config/caution.yaml
    ports: ["8094:8094"]
    environment:
      LCD_BIND: "0.0.0.0"
      LCD_HTTP_PORT: "8094"
      LCD_STATE_DIR: /opt/lcd/state
      LCD_DECISION_LOG_DIR: /opt/lcd/logs
      LCD_SECRETS_YAML: /opt/lcd/secrets.yaml
    volumes:
      - caution-state:/opt/lcd/state
      - ics-logs:/opt/lcd/logs
      - ./logements.lab.yaml:/opt/lcd/logements.yaml:ro
      - ./secrets.lab.yaml:/opt/lcd/secrets.yaml:ro
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8094/health',timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5

  booking-direct:
    build:
      context: ..
      dockerfile: lab/Dockerfile.moteur
      args:
        SCRIPT: custom/booking-direct/booking_direct.py
        CONFIG: lab/lab-config/booking-direct.yaml
    ports: ["8095:8095"]
    environment:
      LCD_BIND: "0.0.0.0"
      LCD_HTTP_PORT: "8095"
      LCD_STATE_DIR: /opt/lcd/state
      LCD_DECISION_LOG_DIR: /opt/lcd/logs
      LCD_SECRETS_YAML: /opt/lcd/secrets.yaml
      LCD_ICS_URL: http://ics-sync:8090
      LCD_PRICING_URL: http://pricing:8091
      LCD_FACTURATION_URL: http://facturation:8093
      LCD_CAUTION_URL: http://caution:8094
    volumes:
      - booking-state:/opt/lcd/state
      - ics-logs:/opt/lcd/logs
      - ./logements.lab.yaml:/opt/lcd/logements.yaml:ro
      - ./secrets.lab.yaml:/opt/lcd/secrets.yaml:ro
    depends_on:
      ics-sync:
        condition: service_healthy
      pricing:
        condition: service_healthy
      facturation:
        condition: service_healthy
      caution:
        condition: service_healthy
      decision:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8095/health',timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 20

  dispatch-presta:
    build:
      context: ..
      dockerfile: lab/Dockerfile.moteur
      args:
        SCRIPT: custom/dispatch-presta/dispatch.py
        CONFIG: lab/lab-config/dispatch.yaml
    ports: ["8096:8096"]
    environment:
      LCD_BIND: "0.0.0.0"
      LCD_HTTP_PORT: "8096"
      LCD_STATE_DIR: /opt/lcd/state
      LCD_DECISION_LOG_DIR: /opt/lcd/logs
      LCD_PRESTATAIRES_DIR: /opt/lcd/prestataires
      LCD_ZONES_YAML: /opt/lcd/zones.yaml
    volumes:
      - dispatch-state:/opt/lcd/state
      - ics-logs:/opt/lcd/logs
      - ./logements.lab.yaml:/opt/lcd/logements.yaml:ro
      - ../custom/zones.yaml:/opt/lcd/zones.yaml:ro
      - ./branding.lab.yaml:/opt/lcd/branding.yaml:ro
      - ./prestataires.lab/:/opt/lcd/prestataires:ro
    command: >
      sh -c "python3 /opt/lcd/custom/dispatch-presta/dispatch.py
      --config /opt/lcd/config.yaml
      --logements /opt/lcd/logements.yaml
      --prestataires /opt/lcd/prestataires
      --zones /opt/lcd/zones.yaml
      --branding /opt/lcd/branding.yaml --serve"
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8096/health',timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5

  inventaire:
    build:
      context: ..
      dockerfile: lab/Dockerfile.moteur
      args:
        SCRIPT: custom/inventaire/inventaire.py
        CONFIG: lab/lab-config/inventaire.yaml
    ports: ["8097:8097"]
    environment:
      LCD_BIND: "0.0.0.0"
      LCD_HTTP_PORT: "8097"
      LCD_STATE_DIR: /opt/lcd/state
      LCD_DECISION_LOG_DIR: /opt/lcd/logs
      LCD_INVENTAIRE_DIR: /opt/lcd/inventaire
    volumes:
      - inventaire-state:/opt/lcd/state
      - ics-logs:/opt/lcd/logs
      - ./logements.lab.yaml:/opt/lcd/logements.yaml:ro
      # inventaire.lab en RW (box-equivalent) : le registre est un état muté à
      # chaque clôture ménage (+1 utilisation). Les runs de tests y ajoutent des
      # biens TEST-INV-* (assertions en >=, reset via `git checkout -- inventaire.lab`).
      - ./inventaire.lab/:/opt/lcd/inventaire
    command: >
      sh -c "python3 /opt/lcd/custom/inventaire/inventaire.py
      --config /opt/lcd/config.yaml
      --logements /opt/lcd/logements.yaml
      --inventaire /opt/lcd/inventaire --serve"
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8097/health',timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5

  extras:
    build:
      context: ..
      dockerfile: lab/Dockerfile.moteur
      args:
        SCRIPT: custom/extras-upsell/extras.py
        CONFIG: lab/lab-config/extras.yaml
    ports: ["8098:8098"]
    environment:
      LCD_BIND: "0.0.0.0"
      LCD_HTTP_PORT: "8098"
      LCD_STATE_DIR: /opt/lcd/state
      LCD_DECISION_LOG_DIR: /opt/lcd/logs
      LCD_EXTRAS_DIR: /opt/lcd/extras
      LCD_TOURISME_DIR: /opt/lcd/tourisme
    volumes:
      - extras-state:/opt/lcd/state
      - ics-logs:/opt/lcd/logs
      - ./logements.lab.yaml:/opt/lcd/logements.yaml:ro
      # Sur-couche extras par logement (données fictives de lab, versionnées).
      - ./extras.lab/:/opt/lcd/extras:ro
      # Office tourisme : lieux publics réels, identiques lab/prod (monté ro
      # depuis custom, comme zones.yaml — pas de lab/*state* ici).
      - ../custom/tourisme/:/opt/lcd/tourisme:ro
    command: >
      sh -c "python3 /opt/lcd/custom/extras-upsell/extras.py
      --config /opt/lcd/config.yaml
      --logements /opt/lcd/logements.yaml
      --extras /opt/lcd/extras
      --tourisme /opt/lcd/tourisme --serve"
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8098/health',timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5

  stocks:
    build:
      context: ..
      dockerfile: lab/Dockerfile.moteur
      args:
        SCRIPT: custom/grocy-stocks/stocks.py
        CONFIG: lab/lab-config/stocks.yaml
    ports: ["8099:8099"]
    environment:
      LCD_BIND: "0.0.0.0"
      LCD_HTTP_PORT: "8099"
      LCD_STATE_DIR: /opt/lcd/state
      LCD_DECISION_LOG_DIR: /opt/lcd/logs
      LCD_STOCKS_DIR: /opt/lcd/stocks
    volumes:
      - stocks-state:/opt/lcd/state
      - ics-logs:/opt/lcd/logs
      - ./logements.lab.yaml:/opt/lcd/logements.yaml:ro
      # stocks.lab en RW (box-equivalent) : les stocks sont mutés à chaque
      # rotation (/conso) et réassort. Reset via `git checkout -- stocks.lab`.
      - ./stocks.lab/:/opt/lcd/stocks
    command: >
      sh -c "python3 /opt/lcd/custom/grocy-stocks/stocks.py
      --config /opt/lcd/config.yaml
      --logements /opt/lcd/logements.yaml
      --stocks /opt/lcd/stocks --serve"
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8099/health',timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5

  compta:
    build:
      context: ..
      dockerfile: lab/Dockerfile.moteur
      args:
        SCRIPT: custom/compta/compta.py
        CONFIG: lab/lab-config/compta.yaml
    ports: ["8100:8100"]
    environment:
      LCD_BIND: "0.0.0.0"
      LCD_HTTP_PORT: "8100"
      LCD_STATE_DIR: /opt/lcd/state
      LCD_DECISION_LOG_DIR: /opt/lcd/logs
    volumes:
      - compta-state:/opt/lcd/state
      - ics-logs:/opt/lcd/logs
      - ./logements.lab.yaml:/opt/lcd/logements.yaml:ro
    command: >
      sh -c "python3 /opt/lcd/custom/compta/compta.py
      --config /opt/lcd/config.yaml
      --logements /opt/lcd/logements.yaml --serve"
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/health',timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5

  llm-router-ui:
    build:
      context: ..
      dockerfile: lab/Dockerfile.moteur
      args:
        SCRIPT: custom/llm-router-ui/router_ui.py
        CONFIG: lab/lab-config/router-ui.yaml
    ports: ["8050:8050"]
    environment:
      LCD_BIND: "0.0.0.0"
      LCD_HTTP_PORT: "8050"
      LCD_STATE_DIR: /opt/lcd/state
    volumes:
      - router-state:/opt/lcd/state
      - ics-logs:/opt/lcd/logs
    command: >
      sh -c "python3 /opt/lcd/custom/llm-router-ui/router_ui.py
      --config /opt/lcd/config.yaml --serve"
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8050/health',timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Box HA virtuelle (lab) : Home Assistant conteneur + provisionnement headless.
  # Moteurs NON recâblés (lab = box-miroir, TODO-BOX rest_command/HA réel) :
  # cette box sert à valider config + entités socle + API (§39).
  ha-bootstrap:
    image: python:3.12-slim
    volumes:
      - haconfig:/config
      - ./ha-virtual/bootstrap.py:/bootstrap.py:ro
    command: ["python3", "/bootstrap.py"]
    restart: "no"
  homeassistant:
    image: homeassistant/home-assistant:stable
    ports: ["8123:8123"]
    environment:
      TZ: "Europe/Paris"
    volumes:
      - haconfig:/config
      - ./ha-virtual/configuration.yaml:/config/configuration.yaml:ro
      - ./ha-virtual/secrets.yaml:/config/secrets.yaml:ro
      - ../homeassistant/packages:/config/packages:ro
    depends_on:
      ha-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request,urllib.error;try:urllib.request.urlopen('http://127.0.0.1:8123/api/',timeout=5);except urllib.error.HTTPError as e:raise SystemExit(0 if e.code==401 else 1)"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s

volumes:
  haconfig:
  ics-state:
  pricing-state:
  decision-state:
  facturation-state:
  caution-state:
  booking-state:
  dispatch-state:
  inventaire-state:
  extras-state:
  stocks-state:
  compta-state:
  router-state:
  ics-logs:

# lab/logements.lab.yaml — COPIE de lab de custom/logements.yaml (JAMAIS l'original).
# Différences vs prod : copro.verifiee=true (sinon moteurs 403 = tests impossibles),
# moteur_direct=maison (tunnel P2-15 testé ici). Données fictives de lab.
# Le réel custom/logements.yaml garde verifiee:false (BLOQUÉ, défaut sûr).

global:
  devise: EUR
  langue_hote: fr
  langues_socle: [fr, en, es, it, de]
  prix_min: 75
  prix_max: 290
  hold_caution_min: 500
  hold_caution_max: 800
  ics_poll_minutes: 15
  menage_montant_defaut: 110
  llm_proxy: "http://llm-stub:4000"
  ui_routage: "http://lab-ui:8050"

logements:
  log1:
    nom: "Santa Severa (LAB)"
    commune: "Saint-Laurent-du-Var"
    logement_id: log1
    surface_m2: 65
    capacite: 5
    vue_mer: true
    pricing:
      prix_base: 110
      prix_min: 75
      prix_max: 290
      mode_gestion_defaut: equilibre
    copro:
      verifiee: true                     # LAB SEUL — réel reste false (BLOQUÉ)
      meuble_entier: true
      chambres_separees: false
      fetes: false
      heures_calmes: "22h-8h"
      occupants_max: 5
      animaux: false
      non_fumeur: true
      taxe_sejour_majoration: 0.10       # Métropole NCA = +10 % dept 06 seul — À CONFIRMER délibération 2026 + guichet mairie
    features:
      smart_lock: true
      voix: true
      clim_ir: true
      extras_upsell: true
      etat_lieux_auto: true
      sinistre_auto: true
      compta_auto: true
      traca_intervenants: true
      inventaire_biens: true
      annuaire_presta: true
      mode_auto_saison: false
      events_auto: true
      memoire_voyageur: true
      vitrines_gratuites: false
      guide_vivant: true                # P6-9-bis §5.7 : gabarits localisés + QR pièces + J-1/J+1
      wallpanel: true                   # kiosk salon (BYOD voyageur seul par ailleurs)
      qr_pieces: true                   # fiches docs/templates/qr_*.svg
      questionnaire: true               # lien J-2 pré-arrivée 3 min
      avis_j1: true                     # enquête J+1 §5.7-bis
      crm_retour: true                 # P6-15 LAB SEUL : code −10 % direct testé ici (réel reste false)
      geoloc_voyageur: true            # P6-15 LAB SEUL : opt-in géoloc séjour testé ici (réel reste false)
    menage:
      montant: 110
      facturation: supplement
    zones: [santa_severa, nice_ouest]
    zone_defaut: santa_severa
    moteur_direct: maison              # LAB : tunnel maison testé ici
    # Mentions légales lues par `decision /mentions-annonce` (§6bis-b).
    # log1 = COMPLET (le cycle brouillon→pret est testable dans §57) ;
    # log2 = NON renseigné = `publiable: false` (cas bloquant, aussi testé).
    mentions:
      numero_declaration: "LAB-DECL-06560-2025"
      dpe: "C"
      classement: "non_classe_nc"

  log2:
    nom: "Logement 2 (LAB)"
    commune: "Saint-Laurent-du-Var"
    logement_id: log2
    surface_m2: 45
    capacite: 4
    vue_mer: false
    pricing:
      prix_base: 90
      prix_min: 75
      prix_max: 290
      mode_gestion_defaut: remplissage_max
    copro:
      verifiee: true                     # LAB SEUL — réel reste false (BLOQUÉ)
      meuble_entier: true
      chambres_separees: false
      fetes: false
      heures_calmes: "22h-8h"
      occupants_max: 4
      animaux: false
      non_fumeur: true
      taxe_sejour_majoration: 0.10       # Métropole NCA = +10 % dept 06 seul — À CONFIRMER délibération 2026 + guichet mairie
    features:
      smart_lock: false
      voix: false
      clim_ir: false
      extras_upsell: false
      etat_lieux_auto: true
      sinistre_auto: false
      compta_auto: true
      traca_intervenants: true
      # LAB SEUL : log2 porte l'inventaire des biens pour que §58 (6bis-c) puisse
      # tester un transfert INTER-logements reel. Le cas « flag off » est
      # desormais porte par le bloc `logtmp:` en bas de fichier (hors topologie
      # passerelle, donc aucun comptage de logement n'en depend).
      inventaire_biens: true
      annuaire_presta: true
      mode_auto_saison: false
      events_auto: true
      memoire_voyageur: true
      vitrines_gratuites: false
      guide_vivant: true                # P6-9-bis §5.7 light : gabarits localisés + QR + J-1/J+1
      wallpanel: true                   # kiosk salon light (boîte à clés, pas de PIN)
      qr_pieces: true                   # fiches docs/templates/qr_*.svg
      questionnaire: true               # lien J-2 pré-arrivée 3 min
      avis_j1: true                     # enquête J+1 §5.7-bis
      crm_retour: false                # P6-15 LAB : log2 off = optin sans code (branche en_attente)
      geoloc_voyageur: false           # P6-15 LAB : log2 off = optin sans effet suivi
    menage:
      montant: 90
      facturation: supplement
    zones: []
    zone_defaut: null
    moteur_direct: maison

# --- LAB SEUL : cas « inventaire des biens DESACTIVE » ------------------------
# Bloc VOLONTAIREMENT hors de `lab/lab-config/passerelle-parc-boxes.yaml` : la
# passerelle ignore ce logement, donc aucun comptage de logements (page,
# calendrier, export-ota, biens) n'en depend. Il existe pour que P6-4 (§473)
# et §58 continuent de prouver que le moteur repond 503 + code metier
# `inventaire_off` — distinct d'une panne — sur un logement sans le flag.
  logtmp:
    nom: "Temoins flag off (hors box)"
    commune: "Lab"
    logement_id: logtmp
    surface_m2: 20
    capacite: 1
    copro:
      verifiee: true
      meuble_entier: true
    features:
      inventaire_biens: false
      annuaire_presta: true

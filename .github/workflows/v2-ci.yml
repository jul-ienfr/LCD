name: v2-ci

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "v2/**"
      - "docs/**"
      - "specs/**"
      - "deploy/**"
      - "README.md"
      - ".github/workflows/**"
      - ".gitleaks.toml"
  pull_request:
    paths:
      - "v2/**"
      - "docs/**"
      - "specs/**"
      - "deploy/**"
      - "README.md"
      - ".github/workflows/**"
      - ".gitleaks.toml"

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Détection de secrets (gitleaks)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.0 detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --redact --no-banner --verbose

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contrôle de fraîcheur documentaire
        run: pwsh ./deploy/test-docs.ps1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lcd
          POSTGRES_PASSWORD: lcd
          POSTGRES_DB: lcd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lcd -d lcd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://lcd:lcd@127.0.0.1:5432/lcd
      MIGRATION_DATABASE_URL: postgres://lcd:lcd@127.0.0.1:5432/lcd
      APP_ROLE_PASSWORD: ci-app-role-password-24-chars
      BETTER_AUTH_SECRET: ci-only-change-me-please-32chars-min
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:check
      - run: npm run db:role-app
      - run: npm run db:test-migrations
      # Le build précède les tests : `tests/budget-js.test.ts` garde le poids
      # des chunks produits (constitution III) et échoue sans build.
      - run: npm run build
      # Couverture mesurée avec seuil (SC-013, FR-030) : 80 % minimum sur
      # `src/domain` et `src/application` ; sous le seuil, la CI échoue.
      - name: Tests unitaires et couverture (seuil 80 %, SC-013)
        run: npm run test:coverage
      - name: Publier le résumé de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: v2/coverage/coverage-summary.json
          if-no-files-found: ignore

  # Recette de release : déclenchée uniquement par un tag `v*`.
  # Reproduit, depuis zéro, l'environnement complet (migrations, rôles, seeds),
  # rejoue la suite e2e contre le build de production et publie les preuves.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: v2
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lcd
          POSTGRES_PASSWORD: lcd
          POSTGRES_DB: lcd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lcd -d lcd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://lcd:lcd@127.0.0.1:5432/lcd
      MIGRATION_DATABASE_URL: postgres://lcd:lcd@127.0.0.1:5432/lcd
      APP_ROLE_PASSWORD: release-app-role-password-24-chars
      BETTER_AUTH_SECRET: ci-only-change-me-please-32chars-min
      BETTER_AUTH_URL: http://127.0.0.1:4173
      # Les specs e2e appellent des routes cron (police, relevés) : le serveur
      # de production et les tests doivent partager la même valeur.
      CRON_SECRET: release-only-cron-secret-32-characters-min
      SEED_ADMIN_EMAIL: admin@lcd.test
      SEED_ADMIN_PASSWORD: ChangeMe-2026!
      SEED_TENANT_SLUG: lcd
      SEED_PRESTA_EMAIL: presta@lcd.test
      SEED_PRESTA_PASSWORD: ChangeMe-2026!
      SEED_PROPRIO_EMAIL: proprio@lcd.test
      SEED_PROPRIO_PASSWORD: ChangeMe-2026!
      SEED_COMMERCIAL_EMAIL: commercial@lcd.test
      SEED_COMMERCIAL_PASSWORD: ChangeMe-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Dépendances
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Cohérence du schéma
        run: npm run db:check

      - name: Migrations
        run: npm run db:migrate

      - name: Seed admin et rôles
        run: npm run db:seed

      - name: Seed logements de démonstration
        run: npm run db:seed-demo

      - name: Rôle applicatif
        run: npm run db:role-app

      - name: RLS
        env:
          DATABASE_URL: postgres://lcd_app:release-app-role-password-24-chars@127.0.0.1:5432/lcd
        run: npm run db:test-rls

      - name: Build production
        run: npm run build

      # Après le build : la garde de budget JS lit `build/client` ;
      # la couverture est mesurée avec le même seuil qu'en CI (SC-013).
      - name: Tests unitaires et couverture
        run: npm run test:coverage

      - name: Smoke test HTTP (build de production)
        env:
          PORT: "4174"
          HOST: "127.0.0.1"
          APP_URL: http://127.0.0.1:4174
          BETTER_AUTH_URL: http://127.0.0.1:4174
          ENQUIRY_ENABLED: "true"
          DATABASE_URL: postgres://lcd_app:release-app-role-password-24-chars@127.0.0.1:5432/lcd
          MIGRATION_DATABASE_URL: postgres://lcd:lcd@127.0.0.1:5432/lcd
        run: |
          node build > /tmp/lcd-smoke.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4174/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          set +e
          npm run smoke -- http://127.0.0.1:4174
          STATUS=$?
          set -e
          kill "$SERVER_PID" 2>/dev/null || true
          if [ "$STATUS" -ne 0 ]; then tail -50 /tmp/lcd-smoke.log; fi
          exit "$STATUS"

      - name: Préflight production
        env:
          NODE_ENV: production
          APP_URL: https://ci.lcd.test
          BETTER_AUTH_URL: https://ci.lcd.test
          BETTER_AUTH_SECRET: release-only-change-me-please-32chars-min
          CRON_SECRET: release-only-cron-secret-32-characters-min
          BACKUP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          SUIVI_HASH_SECRET: release-only-suivi-secret-32-characters-min
          AUTH_2FA_REQUIRED: "true"
          EMAIL_ENABLED: "false"
          STOCKAGE_LOCAL_DIR: /tmp/lcd-photos
          DATABASE_URL: postgres://lcd_app:release-app-role-password-24-chars@127.0.0.1:5432/lcd
          MIGRATION_DATABASE_URL: postgres://lcd:lcd@127.0.0.1:5432/lcd
          PREFLIGHT_ENV_FILE: .env.ci
        run: npm run preflight

      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Suite e2e (build de production)
        env:
          CI: "true"
          PW_SERVEUR: prod
          PW_PORT: "4173"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          APP_URL: http://127.0.0.1:4173
          BETTER_AUTH_URL: http://127.0.0.1:4173
          ENQUIRY_ENABLED: "true"
          DATABASE_URL: postgres://lcd_app:release-app-role-password-24-chars@127.0.0.1:5432/lcd
          MIGRATION_DATABASE_URL: postgres://lcd:lcd@127.0.0.1:5432/lcd
        run: npm run test:e2e

      - name: Publier le rapport e2e
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.ref_name }}
          path: |
            v2/playwright-report
            v2/test-results
          if-no-files-found: ignore
          retention-days: 30

      - name: Publier le build
        uses: actions/upload-artifact@v4
        with:
          name: lcd-build-${{ github.ref_name }}
          path: v2/build
          retention-days: 30

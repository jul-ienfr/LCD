services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lcd
      POSTGRES_PASSWORD: lcd
      POSTGRES_DB: lcd
    ports:
      - "5432:5432"
    # PostgreSQL 18+ : monter /var/lib/postgresql (pas .../data).
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lcd -d lcd"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3 local compatible (S3Mock). MinIO n'est plus nécessaire en dev.
  s3mock:
    image: adobe/s3mock:latest
    environment:
      initialBuckets: lcd
    ports:
      - "9000:9090"
      - "9001:9191"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:

# lab/docker-compose.yml — lab Docker LCD sur PC (branche lab/docker).
# Code dans CE repo, tests ici, déploiement prod/box ENSUITE (jamais depuis le lab).
# Le lab FAIT OFFICE DE BOX : mêmes images génériques transférables, mêmes ports,
# mêmes volumes — seule la config/logements/secrets change par box/logement.
# 0 € logiciel (images python:slim). LAN du lab = réseau docker interne (pas de WAN).
# Secrets : env LCD_* (valeurs FAUSSES de lab) ou lab/secrets.lab.yaml —
# JAMAIS commités (voir .gitignore lab/*state*/ lab/secrets*), JAMAIS de clés réelles.
# Règle persistante : secrets/clés API dans secrets.yaml, jamais commitées.
#
# Usage :
#   cd lab && docker compose up -d --build
#   python3 tests_lab.py            # batterie P2-14 (résa <60 s + conflit ICS + bornes)
#   docker compose down -v          # teardown (volumes runtime supprimés)

name: lcd-lab

services:
  ics-sync:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: lab/Dockerfile.moteur
      args:
        SCRIPT: custom/ics-sync/ics_sync.py
        CONFIG: lab/lab-config/ics-sync.yaml
    ports: ["8090:8090"]
    environment:
      LCD_BIND: "0.0.0.0"
      LCD_HTTP_PORT: "8090"
      LCD_STATE_DIR: /opt/lcd/state
      LCD_DECISION_LOG_DIR: /opt/lcd/logs
      # Secrets de LAB (faux) — jamais de clés réelles ici :
      LCD_SECRETS_YAML: /opt/lcd/secrets.yaml
      # Box HA virtuelle : push events/states réel (JWT lab forgé).
      LCD_HA_URL: http://homeassistant:8123
      LCD_HA_REFRESH_ID: "6c6162326f782d7669727475616c2d02"
      LCD_HA_JWT_KEY: "6c61622d7669727475616c2d6a77742d6c61622d30312d6c61622d3032"
    volumes:
      - ics-state:/opt/lcd/state
      - ics-logs:/opt/lcd/logs
      - ./logements.lab.yaml:/opt/lcd/logements.yaml:ro
      - ./secrets.lab.yaml:/opt/lcd/secrets.yaml:ro
    command: >
      sh -c "python3 /opt/lcd/custom/ics-sync/ics_sync.py
      --config /opt/lcd/config.yaml"
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5

  pricing:

# P7-2 `rest_command.lcd_chat` (cf. §7 + checklist P7-2/P7-4) :
#   - POST proxy unique http://<ip-lan>:4000/v1/chat/completions (HA ne parle qu'au proxy)
#   - model = chaîne lue dans custom/llm-proxy/routing.json (usage voix : primaire UI + fallbacks N)
#   - forçage ponctuel : input_text.logX_llm_model_override > routing.json[logX.voix] > routing.json[global.voix] > local forcé
#   - input_boolean.llm_eu_only = raccourci force lcd-chat-eu quand WAN OK
#   - temperature 0.2, max_tokens 250, timeout 8 s voix, retry 1 par étage + cooldown 30 s
#   - WAN down >2 min → force lcd-chat-local (automation + binary_sensor.wan_ok, dernier recours non supprimable)
#   - LLM consultatif seul : jamais tool-calling serrure/vanne/portail, jamais génération PIN/ouverture
# P7-5 Jev via proxy :4000 (cf. §6.6 + checklist P7-5, PIVOT 2026-10-09 :
#   muse-spark 1.3 + jev-1.13 servis par la gateway :4000 apportée par l'hôte ;
#   wrapper jev-gateway non retenu, P7-20) :
#   - POST http://<ip-lan>:4000/v1/chat/completions (OpenAI-compatible),
#     model jev-1.13, temperature 0.2, max_tokens 250
#   - timeout 6 s, retry 1, jamais de décision cachée côté proxy
#   - kill-switch input_boolean.jev_enabled (off = LLM seul + règles code)
#   - endpoint custom : input_text.logX_jev_endpoint_override (le port peut changer)
#   - seuils : noul>0,8 + confidence>0,75 → auto borné sinon dashboard ;
#     confidence<0,7 → jamais auto ; hors_bornes>0,5 → blocage
# Clés : secrets.yaml seul (llm_proxy_master_key box, custom_llm_api_key_N) —
# jamais commitées, jamais au LLM. Clés/quota amont (muse-spark, jev) =
# gérées par le proxy :4000 lui-même, indépendamment.

# custom/pricing-engine/config.yaml — pricing-engine P2-5 (§3 + §3-quater + §4).
# Secrets : QloApps Webservice (PUT direct Phase 1) + token HA via env LCD_* ou
# secrets.yaml, jamais ici. Secrets YAML : qloapps_webservice_key, ha_api_token.
qloapps_url: "http://<ip-lan>/qloapps"   # LXC LAMP P2-1 (LAN seule)
ics_sync_url: "http://127.0.0.1:8090"    # GET /dispo (même LXC Phase 2+)
ha_url: "http://<ip-lan>:8123"
http_port: 8091
state_dir: "./state"
decision_log_dir: "./state"   # box : monter /config/logs/ ici (cf. ics-sync)
mode_gestion_defaut: equilibre   # equilibre | remplissage_max | revenu_max (cf. §3-bis)
# Saisonnalité Côte d'Azur depuis Saint-Laurent-du-Var (§3, table K_saison).
# Mois -> K. Événements moveables (Carnaval/Cannes/GP) via calendar events (K_events).
k_saison_par_mois: {1: 0.80, 2: 0.80, 3: 1.00, 4: 1.00, 5: 1.40, 6: 1.50,
                    7: 1.70, 8: 1.70, 9: 1.30, 10: 1.00, 11: 0.85, 12: 0.85}
k_saison_noel_nouvel_an: 1.60   # ~20/12 -> ~05/01, écrase le mensuel
# Commissions §4 — expedia absente = inconnue -> reco sans prix canal + motif.
commission_direct: 0.00
commission_airbnb: 0.15
commission_booking: 0.17
commission_abritel: 0.10
# §3-quater (revenus ++) — overrides possibles par logement via custom/logements.yaml.
gap_night_remise: 0.20
tarif_non_remb_remise: 0.10
tarif_flex_plus_majoration: 0.15
late_early_part_nuitee: 0.50
crm_remise_direct: 0.10
superhost_note_seuil: 4.8
superhost_reponse_seuil: 0.90
